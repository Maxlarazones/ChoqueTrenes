<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mapa choque Urda</title>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabecera de última hora, mapa a la izquierda + ficha y esquema del alcance a la derecha; una columna en móvil */
:root{
  --bg:#fbfaf8; --paper:#ffffff; --ink:#1b1a19; --muted:#6b6560; --line:#e4dfda;
  --land:#f1ede8; --land-hi:#e9e2da; --prov:#cfc6bd; --rail:#b7aea6;
  --red:#c5161d; --red-soft:rgba(197,22,29,.12);
  --ave:#3f4f8f; --iryo:#a05a12;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --paper:#1c1b1a; --ink:#f1ece6; --muted:#a59d95; --line:#2f2c2a;
  --land:#22201e; --land-hi:#2a2724; --prov:#45403b; --rail:#5b544e;
  --red:#ff4a4f; --red-soft:rgba(255,74,79,.16); --ave:#8fa3ec; --iryo:#e3a05a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --paper:#1c1b1a; --ink:#f1ece6; --muted:#a59d95; --line:#2f2c2a;
  --land:#22201e; --land-hi:#2a2724; --prov:#45403b; --rail:#5b544e;
  --red:#ff4a4f; --red-soft:rgba(255,74,79,.16); --ave:#8fa3ec; --iryo:#e3a05a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kicker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.live{background:var(--red);color:#fff;padding:3px 8px;border-radius:2px;display:inline-flex;gap:6px;align-items:center}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
.kicker .time{color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.2vw,40px);line-height:1.08;margin:10px 0 8px;text-wrap:balance;letter-spacing:-.01em}
.dek{color:var(--muted);max-width:68ch;margin:0 0 18px;font-size:16px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.mapbox{position:relative;background:var(--paper);border:1px solid var(--line)}
.map{display:block;width:100%;height:auto}
.loc{position:absolute;right:10px;top:10px;width:clamp(92px,22%,150px);height:auto;background:var(--paper);border:1px solid var(--line)}
.sea{fill:var(--paper)}
.prov{fill:var(--land);stroke:var(--prov);stroke-width:1}
.prov.hi{fill:var(--land-hi)}
.provlab{fill:var(--muted);font:600 11px var(--body);letter-spacing:.18em;opacity:.8}
.rail{fill:none;stroke:var(--rail);stroke-width:1;stroke-dasharray:4 3}
.hsl-case{fill:none;stroke:var(--paper);stroke-width:7;stroke-linejoin:round}
.hsl{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
.pk circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.pk text{fill:var(--muted);font:600 10.5px var(--body);font-variant-numeric:tabular-nums}
.tdot{fill:var(--paper);stroke:var(--muted);stroke-width:1.4}.tdot.big{fill:var(--muted)}
.town{fill:var(--ink);font:500 13px var(--body);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.town.big{font-weight:700;font-size:14px}
.unc{fill:var(--red-soft);stroke:var(--red);stroke-width:1;stroke-dasharray:3 3}
.hit{fill:var(--red);stroke:var(--paper);stroke-width:2.5}
.pulse{fill:none;stroke:var(--red);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.callout line{stroke:var(--red);stroke-width:1.5}
.co1{fill:var(--red);font:800 20px var(--display);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.co2{fill:var(--ink);font:700 13px var(--body);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.madrid path{fill:var(--ink)}.madrid text{fill:var(--ink);font:600 12px var(--body)}
.scale line{stroke:var(--ink);stroke-width:1.5}.scale text{fill:var(--muted);font:600 11px var(--body)}
.hatch{stroke:var(--prov);stroke-width:2}
.loc-land{fill:var(--land);stroke:var(--prov);stroke-width:.4}
.loc-hsl{fill:none;stroke:var(--ink);stroke-width:1.6}.loc-hsl.dash{stroke-dasharray:3 2;stroke-width:1.2}
.loc-box{fill:var(--red-soft);stroke:var(--red);stroke-width:1.2}
.loc-city{fill:var(--ink)}.loc-t{fill:var(--ink);font:600 10px var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid var(--ink)}
.sw.conv{border-top:1px dashed var(--rail)}
.sw.dot{width:10px;height:10px;border:0;border-radius:50%;background:var(--red)}
.sw.zone{width:12px;height:12px;border:1px dashed var(--red);border-radius:50%;background:var(--red-soft)}
aside{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);padding:16px}
.card h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.facts dt{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.facts dd{margin:0;min-width:0}
.facts b{font-weight:700}
.scheme{width:100%;height:auto;display:block}
.trk{stroke:var(--ink);stroke-width:2}
.slp{fill:url(#hatch2)}
.car-ave{fill:var(--ave)}.car-iryo{fill:var(--iryo)}
.s-lab{font:700 12px var(--body)}.s-lab.ave{fill:var(--ave)}.s-lab.iryo{fill:var(--iryo)}
.s-sub{fill:var(--muted);font:500 11px var(--body)}
.s-dir{fill:var(--muted);font:600 11px var(--body)}
.s-arrow{stroke:var(--muted);stroke-width:1.5;fill:none}
.burst{fill:var(--red)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--red);padding:2px 0 2px 10px;margin:0}
.src{font-size:12px;color:var(--muted);margin:18px 0 0}
.src a{color:inherit}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse,.live::before{animation:none}.pulse{opacity:0}}
.src{margin:8px 0 0}.wm-big{fill:var(--ink);opacity:.055;font:800 64px var(--display);letter-spacing:.04em;pointer-events:none}.wm{fill:var(--red);font:800 15px var(--display);letter-spacing:.06em}.wm-s{fill:var(--muted);font:600 9px var(--body);letter-spacing:.12em}</style>
</head>
